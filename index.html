<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Musical Inspiration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="AudioPlayer.css">
    <style>
      @font-face {
        font-family: 'Perfect DOS VGA 437';
        src: url('Perfect DOS VGA 437.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Perfect DOS VGA 437', Arial, sans-serif;
        background: #424242;
        color: #383838;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }

      #scrolling-background {
        position: fixed;
        inset: -10%;
        z-index: -2;
        background-image: url('images.png');
        background-size: 96px auto;
        background-repeat: repeat;
        background-position: calc(50% + var(--bg-offset-x, 0px)) calc(50% + var(--bg-offset-y, 0px));
        opacity: 0.16;
        pointer-events: none;
        transform: scale(var(--bg-scale, 1));
        transform-origin: center center;
        will-change: transform, background-position;
      }

      #scrolling-background::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.05));
      }

      #player-background-shell {
        position: relative;
        z-index: 1;
        width: min(90vw, 700px);
        max-width: 700px;
        margin: 0 auto;
        overflow: visible;
      }

      #player {
        position: relative;
        width: 100%;
        border: solid 1px rgb(0, 0, 0);
        background: rgba(59, 59, 59, 0.9);
        box-sizing: border-box;
        overflow: hidden;
        z-index: 1;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      }

      #gif-background-container {
        position: absolute;
        left: 25%;
        width: 50%;
        bottom: 10%;
        transform: translateY(-20px);
        transition: transform 0.05s ease;
        z-index: 0;
        pointer-events: none;
        overflow: visible;
      }

      .playlist-open #gif-background-container {
        transform: translateY(-325px);
      }

      #player-dim-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }

      #hud-canvas {
        display: block;
        width: 100%;
        height: auto;
        max-height: 60vh;
        background: transparent;
        position: relative;
        top: -70px;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.45));
      }
    </style>
  </head>

  <body>
    <div id="scrolling-background"></div>
    <div id="player-background-shell">
      <div id="gif-background-container">
        <canvas id="hud-canvas" width="300" height="200"></canvas>
      </div>
      <div id="player-dim-overlay"></div>
      <div id="player"></div>
    </div>

    <script src="AudioPlayer.js"></script>
    <script>
      const playlistData = [
        { icon: null, title: 'Non henchmen Battle', file: 'regular battle themes/1-15. Battle Among Friends - Waddle Dee.mp3', bpm: 107 },
        { icon: null, title: 'Villain Encounter', file: 'Encounter theme/281. Starring Wario.mp3', bpm: 123 },
        { icon: null, title: 'Henchmen Battle', file: 'Potential boss theme inspiration/01-21 Duel Zone.mp3', bpm: 180 },
        { icon: null, title: 'Snake battle type shi', file: 'Potential boss theme inspiration/01-08 Final Destination - Super Smash Bros..mp3', bpm: 130 },
        { icon: null, title: 'Finale type shi', file: 'Potential boss theme inspiration/17. Boss Battle.mp3', bpm: 96 }
      ];

      const canvas = document.getElementById('hud-canvas');
      const ctx = canvas.getContext('2d');
      const backgroundLayer = document.getElementById('scrolling-background');

      const BEATS_PER_ANIMATION_LOOP = 4;
      const GIF_FRAME_COUNT = 6;
      const GIF_FRAME_FOLDER = 'the gif';
      const GIF_FRAME_PREFIX = 'forgbop';

      let currentBPM = 120;
      let loopDuration = (60 / currentBPM) * BEATS_PER_ANIMATION_LOOP;
      let nativeAudio = null;
      let lastTrackSrc = '';
      let playerInitialized = false;
      let bgOffsetX = 0;
      let bgOffsetY = 0;
      let lastFrameTime = 0;
      let currentZoom = 1;
      let targetZoom = 1;
      let zoomPhase = 0;

      const frames = [];
      for (let i = 1; i <= GIF_FRAME_COUNT; i++) {
        const img = new Image();
        img.src = `${GIF_FRAME_FOLDER}/${GIF_FRAME_PREFIX}${i}.png`;
        img.onload = resizeGifCanvas;
        frames.push(img);
      }

      function resizeGifCanvas() {
        const frame = frames.find(img => img.complete && img.naturalWidth && img.naturalHeight);
        if (!frame) return;
        const container = document.getElementById('gif-background-container');
        const maxWidth = container.clientWidth;
        const maxHeight = window.innerHeight * 0.6;
        const ratio = frame.naturalHeight / frame.naturalWidth;
        let width = maxWidth;
        let height = width * ratio;
        if (height > maxHeight) {
          height = maxHeight;
          width = height / ratio;
        }

        const dpr = window.devicePixelRatio || 1;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function drawGifFrame(frame) {
        if (!frame) return;
        const cssWidth = canvas.width / (window.devicePixelRatio || 1);
        const cssHeight = canvas.height / (window.devicePixelRatio || 1);
        ctx.clearRect(0, 0, cssWidth, cssHeight);
        const imageRatio = frame.naturalWidth / frame.naturalHeight;
        const scale = Math.min(cssWidth / frame.naturalWidth, cssHeight / frame.naturalHeight);
        const drawWidth = frame.naturalWidth * scale;
        const drawHeight = frame.naturalHeight * scale;
        const x = (cssWidth - drawWidth) / 2;
        const y = (cssHeight - drawHeight) / 2;
        ctx.drawImage(frame, x, y, drawWidth, drawHeight);
      }

      function drawInitialFrame() {
        const initialFrame = frames[2];
        if (initialFrame && initialFrame.complete) {
          resizeGifCanvas();
          drawGifFrame(initialFrame);
        } else {
          initialFrame.onload = function() {
            resizeGifCanvas();
            drawGifFrame(initialFrame);
          };
        }
      }

      function getTrackFromSrc(src) {
        if (!src) return null;
        const normalizedSrc = decodeURI(src).toLowerCase();
        const fileName = normalizedSrc.split('/').pop();
        return playlistData.find(track => {
          const trackFileName = track.file.split('/').pop().toLowerCase();
          return normalizedSrc.endsWith(track.file.toLowerCase()) || fileName === trackFileName;
        });
      }

      function updateTrackBPM() {
        if (!nativeAudio) return;

        const currentSrc = nativeAudio.src;
        if (currentSrc === lastTrackSrc) return;
        lastTrackSrc = currentSrc;

        const foundTrack = getTrackFromSrc(currentSrc);
        if (foundTrack && foundTrack.bpm) {
          currentBPM = foundTrack.bpm;
          loopDuration = (60 / currentBPM) * BEATS_PER_ANIMATION_LOOP;
          bgOffsetX = 0;
          bgOffsetY = 0;
          currentZoom = 1;
          lastBeatNumber = -1;
          lastFrameTime = 0;
          if (backgroundLayer) {
            backgroundLayer.style.setProperty('--bg-scale', '1');
            backgroundLayer.style.setProperty('--bg-offset-x', '0px');
            backgroundLayer.style.setProperty('--bg-offset-y', '0px');
          }
          console.log(`Track changed! Title: "${foundTrack.title}" | Dynamic BPM Set to: ${currentBPM}`);
        }
      }

      function getFrameForCurrentBeat(currentTime) {
        const secondsPerBeat = 60 / currentBPM;
        const beatNumber = Math.floor(currentTime / secondsPerBeat);
        const beatIndex = beatNumber % BEATS_PER_ANIMATION_LOOP;
        const withinBeat = currentTime - beatNumber * secondsPerBeat;
        const frameDuration = 1 / 16;
        const animationLength = frameDuration * 3;
        const frameOffset = Math.floor(withinBeat / frameDuration);

        const isOddBeat = beatIndex === 0 || beatIndex === 2;
        const groupStart = isOddBeat ? 0 : 3;
        const frameIndex = groupStart + Math.min(2, frameOffset);

        if (withinBeat < animationLength) {
          return frames[frameIndex];
        }

        return frames[groupStart + 2];
      }

      function updateBackgroundLayer(timestamp) {
        if (!backgroundLayer) return;

        if (!lastFrameTime) {
          lastFrameTime = timestamp || performance.now();
        }

        const deltaTime = Math.min(0.032, (timestamp - lastFrameTime) / 1000 || 0.016);
        lastFrameTime = timestamp || performance.now();

        const beatInterval = 60 / currentBPM;
        const baseScrollMultiplier = Math.max(0.4, Math.min(2.2, beatInterval / 0.6));
        const scrollMultiplier = baseScrollMultiplier * 0.5;
        const scrollSpeedX = 90 * scrollMultiplier;
        const scrollSpeedY = 60 * scrollMultiplier;
        const effectiveScrollSpeedX = nativeAudio && nativeAudio.paused ? 4 : scrollSpeedX;
        const effectiveScrollSpeedY = nativeAudio && nativeAudio.paused ? 4 : scrollSpeedY;
        bgOffsetX += effectiveScrollSpeedX * deltaTime;
        bgOffsetY += effectiveScrollSpeedY * deltaTime;

        const wrapWidth = 1200;
        const wrapHeight = 800;
        bgOffsetX = ((bgOffsetX % wrapWidth) + wrapWidth) % wrapWidth;
        bgOffsetY = ((bgOffsetY % wrapHeight) + wrapHeight) % wrapHeight;

        const secondsPerBeat = 60 / currentBPM;
        const beatProgress = nativeAudio && !nativeAudio.paused && !nativeAudio.ended
          ? (nativeAudio.currentTime % secondsPerBeat) / secondsPerBeat
          : 0.25;

        zoomPhase += deltaTime * (currentBPM / 60);
        if (zoomPhase > Math.PI * 2) {
          zoomPhase -= Math.PI * 2;
        }

        if (nativeAudio && !nativeAudio.paused && !nativeAudio.ended) {
          const zoomPeak = 1 + Math.min(0.10, 0.025 + (currentBPM / 180) * 0.03);
          const smoothWave = 0.5 - 0.5 * Math.cos(zoomPhase);
          targetZoom = 1 + (zoomPeak - 1) * smoothWave;
        } else {
          targetZoom = 1;
        }

        currentZoom += (targetZoom - currentZoom) * 0.18;

        backgroundLayer.style.setProperty('--bg-scale', currentZoom.toFixed(3));
        backgroundLayer.style.transform = `scale(${currentZoom.toFixed(3)})`;
        backgroundLayer.style.setProperty('--bg-offset-x', `${bgOffsetX.toFixed(2)}px`);
        backgroundLayer.style.setProperty('--bg-offset-y', `${bgOffsetY.toFixed(2)}px`);
      }

      function syncAnimation(timestamp) {
        if (nativeAudio && !nativeAudio.paused && !nativeAudio.ended && loopDuration > 0) {
          updateTrackBPM();
          updateBackgroundLayer(timestamp);
          const currentFrame = getFrameForCurrentBeat(nativeAudio.currentTime);
          if (currentFrame && currentFrame.complete) {
            drawGifFrame(currentFrame);
          }
        } else {
          updateBackgroundLayer(timestamp);
        }
        requestAnimationFrame(syncAnimation);
      }

      function attachAudioEvents() {
        nativeAudio = window._nativeAudioRef || document.querySelector('#player audio');
        if (!nativeAudio) {
          setTimeout(attachAudioEvents, 100);
          return;
        }

        nativeAudio.addEventListener('play', () => {
          updateTrackBPM();
          requestAnimationFrame(syncAnimation);
        });
        nativeAudio.addEventListener('timeupdate', updateTrackBPM);

        if (!nativeAudio.paused) {
          updateTrackBPM();
          requestAnimationFrame(syncAnimation);
        }

        console.log('Native audio attached for HUD sync.', nativeAudio);
      }

      function initPlayer() {
        if (playerInitialized) return;
        if (!window.AP) {
          setTimeout(initPlayer, 100);
          return;
        }

        AP.init({
          container: '#player',
          volume: 0.7,
          autoPlay: true,
          notification: false,
          playList: playlistData
        });

        playerInitialized = true;
        console.log('Audio player initialized');
      }

      function initApp() {
        drawInitialFrame();
        initPlayer();
        attachAudioEvents();
        requestAnimationFrame(syncAnimation);
      }

      if (document.readyState === 'complete') {
        initApp();
      } else {
        window.addEventListener('load', initApp);
      }
    </script>
  </body>
</html>
