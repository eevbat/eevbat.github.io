<!DOCTYPE html>
<html >
  <head>
    <meta charset="UTF-8">
    <title>Musical Inspiration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="AudioPlayer.css">
    <style>

    #player{
        position: relative;
        max-width: 700px;
        height: 500px;
        border: solid 1px gray;
    }
    </style>
  </head>

  <body>
      <!-- Audio player container-->
     <div id='player'></div>

    <!-- Audio player js begin-->
    <script src="AudioPlayer.js"></script>

    <script>
        // test image for web notifications
        var iconImage = null;

        AP.init({
            container:'#player',//a string containing one CSS selector
            volume   : 0.7,
            autoPlay : true,
            notification: false,
            playList: [
                {'icon': iconImage, 'title': 'Non henchmen Battle', 'file': 'regular battle themes/1-15. Battle Among Friends - Waddle Dee.mp3'},
                {'icon': iconImage, 'title': 'Villain Encounter', 'file': 'Encounter theme/281. Starring Wario.mp3'}
                {'icon': iconImage, 'title': 'Henchmen Battle', 'file': 'Potential boss theme inspiration/01-21 Duel Zone.mp3'}
          ]
        });
    </script>
    <!-- Audio player js end-->

  </body>
</html>
